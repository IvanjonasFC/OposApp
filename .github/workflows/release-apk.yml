name: Release APK

# Al publicar un Release, compila la APK y la adjunta al propio Release.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        working-directory: oposapp
        run: flutter pub get
      - name: Build APK (release)
        working-directory: oposapp
        run: flutter build apk --release
      - name: Adjuntar APK al Release
        uses: softprops/action-gh-release@v2
        with:
          files: oposapp/build/app/outputs/flutter-apk/app-release.apk
